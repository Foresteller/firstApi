version: '3.8'

services:
  web:
    image: php:8.2-apache
    ports:
      - "8001:80"
    volumes:
      - .:/var/www/html
    depends_on:
      - db
    command: >
      bash -c "docker-php-ext-install pdo pdo_mysql && apache2-foreground"

  db:
    image: mysql:8.0
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: dota_heroes
    volumes:
      - db_data:/var/lib/mysql

volumes:
  db_data: